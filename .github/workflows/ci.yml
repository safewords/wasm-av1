# Prove the decoder: native tests against the ffmpeg reference MD5s (single-
# and multi-threaded), then the wasm variants driven from Node, then the wasm
# build artefacts. The threads variants rebuild std with atomics, hence the
# rust-src component (rust-toolchain.toml lists it too).
#
# Public repository, so GitHub's hosted runners. The wasm-bindgen CLI is
# pinned to the crate version in Cargo.lock; binaryen comes from GitHub
# releases so wasm-opt runs the same version everywhere. Releases are cut by
# release.yml on a `v*` tag, which reuses the same steps.
name: wasm-av1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: "5G"
  WASM_BINDGEN_VERSION: 0.2.127
  BINARYEN_VERSION: version_123

jobs:
  native:
    name: cargo fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy, rust-src
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Optimised: rav1d in debug decodes the fixtures painfully slowly.
      - run: cargo test --release
      - name: also without the container feature
        run: cargo test --release --no-default-features --features bitdepth_8,bitdepth_16

  wasm:
    name: build the variants, test them in Node
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@v0.0.9
      # The tests are written and verified against Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: wasm-bindgen-cli ${{ env.WASM_BINDGEN_VERSION }}
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" --wildcards '*/wasm-bindgen' '*/wasm-bindgen-test-runner'
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/wasm-bindgen" --version
      - name: binaryen (wasm-opt)
        run: |
          mkdir -p "$HOME/binaryen"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar -xz --strip-components=1 -C "$HOME/binaryen"
          echo "$HOME/binaryen/bin" >> "$GITHUB_PATH"
          "$HOME/binaryen/bin/wasm-opt" --version
      - name: in-wasm tests (wasm-bindgen-test in Node), baseline and simd
        run: |
          cargo test --release --target wasm32-unknown-unknown --test wasm_convert
          RUSTFLAGS="-C target-feature=+simd128" cargo test --release --target wasm32-unknown-unknown --test wasm_convert --target-dir target/wasm-test-simd
      - name: build baseline, simd, threads, simd-threads
        run: bash scripts/build.sh
      # Informational: a Windows-built pkg/ and this Linux build differ in the
      # source paths rustc embeds in panic strings, so this cannot be a hard
      # check. What ships is release.yml's own build of the tag.
      - name: does the committed pkg/ match this build?
        run: |
          if git diff --quiet -- pkg/; then echo "pkg/ matches this build"; else echo "::warning::committed pkg/ differs from this build (expected across OSes; scripts/build.sh regenerates it)"; git diff --stat -- pkg/; fi
      - name: node tests against the built wasm
        run: node --test test/decode.test.mjs
      - name: sizes
        run: cat pkg/manifest.json && for v in baseline simd threads simd-threads; do echo "$v gzip: $(gzip -9 -c pkg/$v/wasm_av1_bg.wasm | wc -c)"; done
      - uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: pkg/
          retention-days: 14
