[package]
name = "wasm-av1"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "AV1 decoding for the browser: rivet-av1 compiled to WebAssembly, in baseline, SIMD and threads builds. A Rust port of GoogleChromeLabs/wasm-av1."
repository = "https://github.com/safewords/wasm-av1"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The decoder core: rivet-av1 (imported as `av1`), rivet's own AV1 decoder,
# written from the specification — no C, no libc, one dependency. Open
# Encoding Attribution License 1.0 (source-available; see NOTICE). It is
# `crates/av1` of rivet, a submodule there whose own repository is
# https://github.com/safewords/rivet-av1; taken from rivet `develop` like
# rivet-container, so one git source carries both. Nothing of it is vendored
# here; Cargo.lock pins the revision. docs/rivet-av1.md has what it does, what
# this crate needs of it, and how fast it is.
av1 = { git = "https://github.com/rivet-transcoder/rivet", branch = "develop", package = "rivet-av1" }
# The demuxers: MP4/fMP4/CMAF, WebM/MKV, TS. rivet is the org's own transcoder;
# its `rivet-container` crate hands us AV1 temporal units + pts straight out of
# a container. rivet `develop` carries the commit that lets the crate build
# without rivet-codec (see docs/rivet.md); Cargo.lock pins the revision.
# Optional: without the `container` feature only IVF and raw temporal units are
# accepted, and the .wasm is smaller.
container = { git = "https://github.com/rivet-transcoder/rivet", branch = "develop", package = "rivet-container", default-features = false, optional = true }
bytes = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
md-5 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["container"]
# MP4/fMP4/WebM/TS input via rivet-container (`setSourceContainer`).
container = ["dep:container", "dep:bytes"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "debuginfo"

# The native harness/tests decode real streams; an unoptimised decoder is painfully slow.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 2
